# Spyne Configuration File
# Default paths and parameters for spine segmentation and analysis

models:
  segmentation:
    path: inference_models/deepd3/model_250414_trial18.h5
    description: DeepD3 segmentation model for spine and dendrite detection
  classifier:
    path: inference_models/calcium_event_classifier/your_model_with_dff.pth
    description: Calcium event classifier for detecting activity events

segmentation:
  spine_threshold: 0.3
  dendrite_threshold: 0.7
  mask_size: 3
  min_distance: 5
  min_spine_size: 4.0
  min_dendrite_size: 15.0
  dendrite_dilation_iterations: 12
  
classification:
  percentile_cutoff: 99
  description: Percentile threshold for calcium event probability
