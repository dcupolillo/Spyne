name: spyne-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - numpy=1.23.5
  - scipy=1.10.1
  - matplotlib=3.8.2
  - tifffile=2024.2.12
  - scikit-image=0.22.0
  - tqdm=4.66.2
  - flammkuchen=1.0.3
  - tensorflow-gpu=2.8.0  # GPU version for CUDA-enabled systems
  - pytorch::pytorch::*=*=cuda*  # GPU version with CUDA support
  - pytorch::torchvision
  - h5py=3.10.0
  - pandas=1.5.3
  - scikit-learn=1.4.0
  - pip:
      - git+https://github.com/dcupolillo/ROIpy.git
      - git+https://github.com/dcupolillo/calcium_imaging_classifier.git
