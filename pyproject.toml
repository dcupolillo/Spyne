[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spyne"
version = "0.1.0"
description = "Calcium imaging analysis for dendritic spines with ScanImage integration"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "dcupolillo"}
]
license = "MIT"
keywords = ["calcium imaging", "dendritic spines", "scanimage", "microscopy"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]


# Core dependencies
# Note: torch, torchvision, and tensorflow are specified in conda environments
# (environment.yml for GPU, environment_CPU.yml for CPU)
dependencies = [
    "numpy==1.23.5",
    "protobuf==3.20.3",
    "scipy==1.10.1",
    "matplotlib==3.8.2",
    "scikit-image==0.22.0",
    "tifffile==2024.2.12",
    "flammkuchen==1.0.3",
    "tqdm==4.66.2",
    "opencv-python==4.8.0.76",
    "pyabf==2.3.8",
    "jupyter>=1.0.0",
    "seaborn>=0.11.0",
    "pandas>=1.3.0",
    "plotly>=5.0.0",
    "pyyaml>=5.4.0",
    "ipfx>=0.9.0",
    "deepd3 @ git+https://github.com/dcupolillo/deepd3.git",
    "ROIpy @ git+https://github.com/dcupolillo/ROIpy.git",
    "calcium_event_classifier @ git+https://github.com/dcupolillo/calcium_event_classifier.git",
    "miniML @ git+https://github.com/dcupolillo/miniML.git",
]

[project.urls]
Homepage = "https://github.com/dcupolillo/spyne"
Repository = "https://github.com/dcupolillo/spyne.git"
Issues = "https://github.com/dcupolillo/spyne/issues"
Documentation = "https://github.com/dcupolillo/spyne/#readme"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["spyne*"]

[tool.setuptools.package-data]
ROIpy = ["py.typed"]
